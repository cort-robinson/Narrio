name: Narrio CI and releases

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narrio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths conservatively
        id: changes
        env:
          PR_BASE_BRANCH: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/android-required.mjs

  build:
    name: Build, unit tests, and lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.changes.outputs.android == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - if: needs.changes.outputs.android == 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - if: needs.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test CI path selection
        run: node --test scripts/ci/*.test.mjs
      - name: Test release calculations and recovery
        run: npm test
      - name: Verify Android build
        if: needs.changes.outputs.android == 'true'
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Preview version and release notes
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: npm run release:preview
      - name: Upload build reports and release preview
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-reports
          path: |
            app/build/reports/
            artifacts/release-preview.md
          retention-days: 14

  native:
    name: Android smoke tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore clean emulator snapshot
        id: avd-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/avd/
          key: narrio-avd-v1-${{ runner.os }}-${{ runner.arch }}-api35-google_apis-x86_64-pixel_6-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Generate clean emulator snapshot on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo 'Clean emulator snapshot generated.'
      # Save before installing Narrio or its test APK, so cached devices contain no test state.
      # PR runs only restore shared caches; trusted branch pushes seed them.
      - name: Cache clean emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/avd/
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}
      - name: Run Android smoke tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.narrio.PersistenceAndRenewalTest,app.narrio.NowPlayingDismissTest,app.narrio.SourceExperienceTest,app.narrio.BookDiscoveryExperienceTest,app.narrio.BookSourceDiscoveryAndroidTest,app.narrio.AddonSettingsExperienceTest,app.narrio.AppUpdatesExperienceTest,app.narrio.FollowAlongMigrationTest,app.narrio.FollowAlongTest#localTextHighlightsSeeksAndRestoresTimingMatches,app.narrio.FollowAlongTest#suppliedTimestampsNeverCarryOverToAnotherAudioPart,app.narrio.FollowAlongTest#wholeBookChapterNavigationKeepsTheWholeRecordingTimeline
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-smoke-reports
          path: app/build/reports/androidTests/
          retention-days: 14

  gate:
    name: CI
    if: always()
    needs: [changes, build, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$BUILD_RESULT" = success
          case "$ANDROID_REQUIRED:$NATIVE_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac

  preview:
    name: Development APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore preview signing identity
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: node scripts/release/signing.mjs
      - name: Build and verify Narrio Dev
        env:
          NARRIO_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          NARRIO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          NARRIO_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          NARRIO_EXPECTED_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: npm run release:dev
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Narrio-Dev-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: node scripts/release/signing.mjs clean

  preview-publish:
    name: Publish phone preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download verified preview from this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "Narrio-Dev-$GITHUB_RUN_NUMBER" --dir artifacts
      - name: Publish verified APK with direct phone download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish-preview.mjs

  preview-status:
    name: Update preview test status
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.preview-publish.result == 'success'
    needs: [build, native, preview-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download original preview metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "Narrio-Dev-$GITHUB_RUN_NUMBER" --dir artifacts
      - name: Record the completed test results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: node scripts/release/publish-preview.mjs --status

  release:
    name: Stable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore stable signing identity
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: node scripts/release/signing.mjs
      - name: Publish verified stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NARRIO_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          NARRIO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          NARRIO_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          NARRIO_EXPECTED_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: npm run release
      - name: Retain release artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stable-release-artifacts
          path: artifacts/
          retention-days: 90
      - name: Remove signing material
        if: always()
        run: node scripts/release/signing.mjs clean
