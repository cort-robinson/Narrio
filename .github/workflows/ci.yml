name: Narrio CI and releases

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narrio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads earlier runs' artifacts to find smoke tests that already passed on this tree.
      actions: read
    outputs:
      android: ${{ steps.changes.outputs.android }}
      tree: ${{ steps.evidence.outputs.tree }}
      smoke_reused: ${{ steps.evidence.outputs.smoke_reused }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths conservatively
        id: changes
        env:
          PR_BASE_BRANCH: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/android-required.mjs
      # The emulator suite only depends on the files it tests, so a tree that already passed it
      # in this repository's own run of this workflow does not need it again. Manual runs always test.
      - name: Look for smoke tests that passed on this exact source tree
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_REQUIRED: ${{ steps.changes.outputs.android }}
        run: node scripts/ci/smoke-evidence.mjs

  build:
    name: Build, unit tests, and lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.changes.outputs.android == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - if: needs.changes.outputs.android == 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - if: needs.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test CI path selection
        run: node --test scripts/ci/*.test.mjs
      - name: Test release calculations and recovery
        run: npm test
      - name: Verify Android build
        if: needs.changes.outputs.android == 'true'
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Preview version and release notes
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: npm run release:preview
      - name: Upload build reports and release preview
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-reports
          path: |
            app/build/reports/
            artifacts/release-preview.md
          retention-days: 14

  native:
    # The suite is split by class across parallel emulators, balanced by the seconds in the list file.
    # To change the number of emulators, change the shard list; the job reads its index and the total.
    name: Android smoke tests
    needs: changes
    if: needs.changes.outputs.android == 'true' && needs.changes.outputs.smoke_reused != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SMOKE_SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
    # Each test runs in its own process; one shard takes about 3 minutes of tests after setup, boot, and build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore clean emulator snapshot
        id: avd-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The system image is cached too, so each emulator job does not download it again.
          path: |
            ~/.android/avd/
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64/
          key: narrio-avd-v2-${{ runner.os }}-${{ runner.arch }}-api35-google_apis-x86_64-pixel_6-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Generate clean emulator snapshot on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The reader's WebView renderer is killed when memory runs short, which takes the app down with it.
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo 'Clean emulator snapshot generated.'
      # Save before installing Narrio or its test APK, so cached devices contain no test state.
      # PR runs only restore shared caches; trusted branch pushes seed them.
      - name: Cache clean emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64/
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}
      - name: Run Android smoke tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The reader's WebView renderer is killed when memory runs short, which takes the app down with it.
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # AGP 9's test engine splits instrumentation arguments on commas, so a comma-separated
          # class list silently runs only its first class. The runner reads the list from a device file instead.
          script: |
            node scripts/ci/android-smoke-tests.mjs list "$SMOKE_SHARD" > "$RUNNER_TEMP/android-smoke-tests.txt"
            adb push "$RUNNER_TEMP/android-smoke-tests.txt" /data/local/tmp/narrio-smoke-tests.txt
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.testFile=/data/local/tmp/narrio-smoke-tests.txt
      - name: Verify every smoke-test class ran
        if: ${{ !cancelled() }}
        run: node scripts/ci/android-smoke-tests.mjs verify app/build/outputs/androidTest-results/connected "$SMOKE_SHARD"
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-smoke-reports-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  # Every shard passed and verified its classes, and the shards cover the whole list, so record
  # that this tree passed. Later runs on the same tree, such as a promotion PR, reuse it. Only
  # branch pushes and manual runs record it: they test their own commit, which a later run can
  # check against the tree. A pull request run tests a merge commit that cannot be checked later.
  smoke-evidence:
    name: Record passing smoke tests
    needs: [changes, native]
    if: github.event_name != 'pull_request' && needs.native.result == 'success' && needs.changes.outputs.tree != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Describe the passing run
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: printf '{"tree":"%s","sha":"%s","run":"%s"}\n' "$TREE" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/smoke-passed.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-smoke-passed-${{ needs.changes.outputs.tree }}
          path: ${{ runner.temp }}/smoke-passed.json
          retention-days: 30
          if-no-files-found: error

  gate:
    # A branch push must never satisfy a pull request's merge gate on the same SHA.
    name: ${{ github.event_name == 'pull_request' && 'PR CI' || 'Branch CI' }}
    if: always()
    needs: [changes, build, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          SMOKE_REUSED: ${{ needs.changes.outputs.smoke_reused }}
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$BUILD_RESULT" = success
          # Android work either ran the emulators here or reused a pass on this exact tree.
          case "$ANDROID_REQUIRED:$SMOKE_REUSED:$NATIVE_RESULT" in
            true:false:success|true:true:skipped|false:false:skipped) ;;
            *) exit 1 ;;
          esac

  preview:
    name: Development APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore preview signing identity
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: node scripts/release/signing.mjs
      - name: Build and verify Narrio Dev
        env:
          NARRIO_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          NARRIO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          NARRIO_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          NARRIO_EXPECTED_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: npm run release:dev
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Narrio-Dev-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: node scripts/release/signing.mjs clean

  preview-publish:
    name: Publish phone preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download verified preview from this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "Narrio-Dev-$GITHUB_RUN_NUMBER" --dir artifacts
      - name: Publish verified APK with direct phone download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish-preview.mjs

  preview-status:
    name: Update preview test status
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.preview-publish.result == 'success'
    needs: [changes, build, native, preview-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download original preview metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "Narrio-Dev-$GITHUB_RUN_NUMBER" --dir artifacts
      - name: Record the completed test results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.changes.outputs.smoke_reused == 'true' && needs.native.result == 'skipped' && 'success' || needs.native.result }}
        run: node scripts/release/publish-preview.mjs --status

  release:
    name: Stable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore stable signing identity
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: node scripts/release/signing.mjs
      - name: Publish verified stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NARRIO_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          NARRIO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          NARRIO_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          NARRIO_EXPECTED_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: npm run release
      - name: Retain release artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stable-release-artifacts
          path: artifacts/
          retention-days: 90
      - name: Remove signing material
        if: always()
        run: node scripts/release/signing.mjs clean
